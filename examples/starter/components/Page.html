<header class="page-header">
  <a class="page-header-dots" href="#1" aria-label="First page"><span></span><span></span><span></span></a>
  <span class="page-header-title">{{ PAGE_TITLE }}</span>
  <nav class="page-header-nav">
    <button data-nav="prev" aria-label="Previous page">&larr;</button>
    <span class="page-header-counter">{{ PAGE_NUMBER }} / {{ PAGE_COUNT }}</span>
    <button data-nav="next" aria-label="Next page">&rarr;</button>
  </nav>
</header>
