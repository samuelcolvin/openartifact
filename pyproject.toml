[project]
name = "openartifact"
version = "0.1.0"
description = "Markdown slide decks rendered in the browser, with a print stylesheet that makes PDF export work."
readme = "README.md"
license = "MIT"
authors = [{ name = "Samuel Colvin", email = "s@muelcolvin.com" }]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "httpx2>=2.13.1",
    "logfire[asyncpg]==6.0.0b7",
    "obstore>=0.11.1",
    "py-key-value-aio[postgresql,wrappers-encryption]>=0.4.6",
    "pydantic-monty>=1.0.0",
    "uvicorn>=0.54.0",
]

# Not a package: backend/ is a handful of modules imported by path (pytest and pyright add it to the path), with
# backend/main.py the entry point; render/ is the PDF render service, a package imported from the repo root. The
# dependencies above are for the application server; build.py and render/pdf.py need none.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "basedpyright>=1.29",
    "pytest>=8",
    "ruff>=0.12",
]
# What render/Dockerfile installs: the render service alone, without the application server's stack.
render = [
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120
include = ["*.py", "backend/**/*.py", "render/**/*.py", "tests/**/*.py", "examples/*.py"]

[tool.ruff.lint]
extend-select = [
    "Q",      # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "RUF100", # https://docs.astral.sh/ruff/rules/unused-noqa/
    "I",      # https://docs.astral.sh/ruff/rules/#isort-i
    "FA",     # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 14 }

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["auth", "build", "config", "db", "mcp_server", "render", "server", "store", "upload", "workspace"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
include = ["*.py", "backend", "render", "tests", "examples"]
extraPaths = ["backend"]

[tool.logfire]
# Tests import modules that open spans without calling logfire.configure(); that is fine.
ignore_no_config = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ for its modules by name, the root for the `render` package.
pythonpath = ["backend", "."]
