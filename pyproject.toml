[project]
name = "openartifact"
version = "0.1.0"
description = "Markdown slide decks rendered in the browser, with a print stylesheet that makes PDF export work."
readme = "README.md"
license = "MIT"
authors = [{ name = "Samuel Colvin", email = "s@muelcolvin.com" }]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "httpx2>=2.13.1",
    "logfire[asyncpg,httpx]==6.0.0b7",
    # Pinned to a git branch below, see [tool.uv.sources].
    "logfire-sdk",
    "obstore>=0.11.1",
    "py-key-value-aio[postgresql,wrappers-encryption]>=0.4.6",
    "pydantic-monty>=1.0.0",
    "uvicorn>=0.54.0",
    "pydantic-ai-slim[anthropic,mcp,openai]==2.54.0",
]

# Not a package: backend/ is a handful of modules imported by path (pytest and pyright add it to the path), with
# backend/main.py the entry point; chrome/ is the chrome service, a package imported from the repo root. The
# dependencies above are for the application server; build.py and chrome/pdf.py need none.
[tool.uv]
package = false

[tool.uv.sources]
# The fix for HTTP span messages from FastAPI's built-in telemetry (pydantic/logfire#2513, fixed by #2516): without
# it every request shows as just "GET" in Logfire. Drop this source once a release includes it.
logfire-sdk = { git = "https://github.com/pydantic/logfire", branch = "stable-semconv-http-message", subdirectory = "logfire-sdk" }

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "basedpyright>=1.29",
    "pytest>=8",
    "ruff>=0.12",
]
# What chrome/Dockerfile installs: the chrome service alone, without the application server's stack.
chrome = [
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "logfire==6.0.0b7",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120
include = ["*.py", "backend/**/*.py", "chrome/**/*.py", "tests/**/*.py", "examples/*.py"]

[tool.ruff.lint]
extend-select = [
    "Q",      # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "RUF100", # https://docs.astral.sh/ruff/rules/unused-noqa/
    "I",      # https://docs.astral.sh/ruff/rules/#isort-i
    "FA",     # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 14 }

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["access", "agent", "api", "auth", "build", "chats", "config", "db", "chrome", "login", "mcp_server", "pages", "server", "signing", "store", "upload", "workspace"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
include = ["*.py", "backend", "chrome", "tests", "examples"]
extraPaths = ["backend"]

[tool.logfire]
# Tests import modules that open spans without calling logfire.configure(); that is fine.
ignore_no_config = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ for its modules by name, the root for the `chrome` package.
pythonpath = ["backend", "."]
