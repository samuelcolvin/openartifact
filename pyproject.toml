[project]
name = "openartifact"
version = "0.1.0"
description = "Markdown slide decks rendered in the browser, with a print stylesheet that makes PDF export work."
readme = "README.md"
license = "MIT"
authors = [{ name = "Samuel Colvin", email = "s@muelcolvin.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "logfire>=5.1.1",
    "pydantic-monty>=1.0.0",
    "uvicorn>=0.54.0",
]

# Not a package: backend/ is a handful of modules imported by path (pytest and pyright add it to the path), with
# backend/server.py the only entry point. The dependencies above are for the server only; build.py and pdf.py need none.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120
include = ["*.py", "backend/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = [
    "Q",      # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "RUF100", # https://docs.astral.sh/ruff/rules/unused-noqa/
    "I",      # https://docs.astral.sh/ruff/rules/#isort-i
    "FA",     # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 14 }

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["build", "mcp_server", "server"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
include = ["*.py", "backend", "tests"]
extraPaths = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
