# Local services for development and tests. `make postgres` starts the database;
# the server and tests reach it at DATABASE_URL=postgresql://postgres:postgres@localhost:5432/openartifact.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openartifact
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres:
