# Local services for development and tests. `make pg-start` starts the database;
# the server and tests reach it at DATABASE_URL=postgresql://postgres:postgres@localhost:5432/openartifact.
# `make docker-up` builds the application image (Dockerfile) and the chrome image (chrome/Dockerfile) and runs
# them against that database: the app on http://127.0.0.1:8765 (OPENARTIFACT_PORT overrides the host port) with
# the dev token, its checkout cache in the `data` volume and its object store in ./data/store, shared with
# `make dev`; the chrome service on the private network, also bound to 127.0.0.1:8766 so `make dev` can use it.
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/openartifact
      OPENARTIFACT_DEV_TOKEN: ${OPENARTIFACT_DEV_TOKEN:-dev}
      # Set these three in the environment to put the MCP endpoint and the pages behind Google login instead.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENARTIFACT_SECRET_KEY: ${OPENARTIFACT_SECRET_KEY:-}
      OPENARTIFACT_BASE_URL: http://127.0.0.1:${OPENARTIFACT_PORT:-8765}
      # The chrome service fetches pages from the app over the compose network, not at the public address. Not as
      # `http://app:8765`: `app` is a Google TLD on Chrome's HSTS preload list, so Chrome forces the bare hostname
      # `app` to HTTPS and the page never loads. The alias below is a name Chrome has no opinion about.
      OPENARTIFACT_INTERNAL_URL: http://openartifact.internal:8765
      OPENARTIFACT_CHROME_URL: http://chrome:8766
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    ports:
      - '${OPENARTIFACT_PORT:-8765}:8765'
    volumes:
      # The object store is the directory the host server uses too, so `make dev` and `make docker-up` share the
      # database above and the bundles it points at. The checkout cache stays private to the container.
      - ./data/store:/data/store
      - data:/data/cache
    networks:
      default:
        aliases:
          - openartifact.internal
    depends_on:
      postgres:
        condition: service_healthy
      chrome:
        condition: service_healthy

  chrome:
    build:
      context: .
      dockerfile: chrome/Dockerfile
    environment:
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    ports:
      # For `make dev` on the host; the chrome service prints any URL it is given, so never bind it publicly.
      - '127.0.0.1:${OPENARTIFACT_CHROME_PORT:-8766}:8766'
    extra_hosts:
      # So a page served by `make dev` on the host is reachable from inside the container as host.docker.internal.
      - 'host.docker.internal:host-gateway'

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openartifact
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres:
  data:
